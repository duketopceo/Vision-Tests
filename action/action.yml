name: argus-reviewer
description: Run the argus-reviewer harness and post a sticky PR comment with cost and evidence.
author: duketopceo
inputs:
  openrouter-api-key:
    description: OpenRouter API key (BYOK). All vision calls are billed through this key.
    required: true
  cli:
    description: Command used to run argus-reviewer (defaults to `npx --no-install argus-reviewer`). For dogfooding this repo, use `node dist/cli.js` after `npm run build`.
    default: npx --no-install argus-reviewer
    required: false
  config:
    description: Path to the argus-reviewer config file
    default: argus-reviewer.config.ts
    required: false
  working-directory:
    description: Working directory for the consumer's project
    required: false
  budget-usd:
    description: Optional per-run budget cap override in USD
    required: false
  index:
    description: Run `argus-reviewer index` before the test run to enable diff-aware cache invalidation
    default: 'true'
    required: false
  diff-base:
    description: Base ref for diff invalidation (e.g. origin/main); empty = working tree
    default: ''
    required: false
  node-version:
    description: Node.js version for the harness (Node 20 is deprecated on GH runners)
    default: '22'
    required: false
  browser:
    description: Playwright browser engine to install and run (chromium, firefox, or webkit). Should match config.browser.
    default: 'chromium'
    required: false
  cache-dependency-path:
    description: npm lockfile path for setup-node cache (defaults to <working-directory>/package-lock.json)
    required: false
  report-dir:
    description: Report output dir, passed to both run and code-review so the post step can find run.json/code-review.json regardless of config reportDir
    default: argus-reviewer-report
    required: false
outputs:
  conclusion:
    description: 'Run conclusion: success, failure, or neutral'
    value: ${{ steps.post.outputs.conclusion }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/package-lock.json', inputs.working-directory || '.') }}

    - name: Install consumer dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Install Playwright browser
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install "${{ inputs.browser }}"

    - name: Stage config
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.config }}" != "argus-reviewer.config.ts" ]; then
          ext="${{ inputs.config }}"
          ext="${ext##*.}"
          case "$ext" in
            ts|json) cp "${{ inputs.config }}" "argus-reviewer.config.$ext" ;;
            *) echo "unsupported config extension: $ext" >&2; exit 1 ;;
          esac
        fi

    - name: Build repo index
      if: inputs.index == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.cli }} index

    - name: Run argus-reviewer code review
      id: code-review
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        ARGUS_DEBUG: '1'
        ARGUS_REVIEWER_TRACE: >-
          {"repo":"${{ github.repository }}",
          "pr":"${{ github.event.pull_request.number }}",
          "commit":"${{ github.sha }}",
          "run_id":"${{ github.run_id }}",
          "run_attempt":"${{ github.run_attempt }}",
          "workflow":"${{ github.workflow }}"}
      run: ${{ inputs.cli }} code-review --report-dir "${{ inputs.report-dir }}"

    - name: Run argus-reviewer
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        ARGUS_DEBUG: '1'
        ARGUS_DIFF_BASE: ${{ inputs.diff-base }}
        ARGUS_BUDGET_USD: ${{ inputs.budget-usd }}
        ARGUS_REVIEWER_TRACE: >-
          {"repo":"${{ github.repository }}",
          "pr":"${{ github.event.pull_request.number }}",
          "commit":"${{ github.sha }}",
          "run_id":"${{ github.run_id }}",
          "run_attempt":"${{ github.run_attempt }}",
          "workflow":"${{ github.workflow }}"}
      run: ${{ inputs.cli }} run --report-dir "${{ inputs.report-dir }}"

    - name: Post or update sticky PR comment
      id: post
      uses: actions/github-script@v7
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        VISION_E2E_WORKING_DIR: ${{ inputs.working-directory }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const actionPath = process.env.GITHUB_ACTION_PATH;
          const file = path.join(actionPath, 'sticky-comment.mjs');
          const code = fs.readFileSync(file, 'utf8');
          const runFn = new Function('github', 'context', 'core', 'require', `return (async () => {\n${code}\n})()`);
          return await runFn(github, context, core, require);
